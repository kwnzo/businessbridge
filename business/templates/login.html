<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='favicon.png') }}">
  <title>Бизнес‑Мост | Вход</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Unbounded', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url("{{ url_for('static', filename='authorization.png') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    
    /* ====== ФОРМА АВТОРИЗАЦИИ ================================================================================ */
    /* Контейнер для формы авторизации */
    .auth-container {
      flex: 1; /* Занимает все доступное пространство */
      display: flex; /* Flexbox */
      justify-content: center; /* Центрирование по горизонтали */
      align-items: center; /* Центрирование по вертикали */
      width: 100%; /* На всю ширину */
      padding: 0px 16px; /* Внутренние отступы */
      flex-wrap: wrap; /* Перенос на новую строку */
      align-content: flex-start; /* Выравнивание содержимого */
    }

    /* Контейнер для формы входа */
    .container-login {
      width: 650px; /* Ширина контейнера */
    }

    /* Блок формы авторизации */
    .auth-box {
      background-color: #ffffff; /* Цвет фона */
      color: #000000; /* Цвет текста */
      border-radius: 35px; /* Закругление углов */
      padding: 40px 30px; /* Внутренние отступы */
      width: 100%; /* На всю ширину */
      max-width: 550px; /* Максимальная ширина */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); /* Тень */
      margin-bottom: 45px;
    }

    /* Заголовок формы */
    .auth-box h2 {
      text-align: center; /* Выравнивание по центру */
      font-size: 28px; /* Размер шрифта */
      font-weight: 600; /* Толщина шрифта */
      margin-bottom: 24px; /* Отступ снизу */
    }

    /* Переключатель типа формы */
    .auth-toggle {
      display: flex; /* Flexbox */
      justify-content: center; /* Центрирование по горизонтали */
      margin-bottom: 24px; /* Отступ снизу */
      gap: 30px; /* Расстояние между элементами */
    }

    /* Кнопки переключателя */
    .auth-toggle button {
      padding: 10px 20px; /* Внутренние отступы */
      border: 2px solid #ccc; /* Граница */
      background-color: #635c6c; /* Прозрачный фон */
      border-radius: 15px; /* Закругление углов */
      font-size: 16px; /* Размер шрифта */
      cursor: pointer; /* Курсор-указатель */
      transition: all 0.3s ease; /* Плавные переходы */
      color: #ffffff; /* Цвет текста */
      width: 170px;
      font-weight: 600;
    }

    /* Активная кнопка переключателя */
    .auth-toggle button.active,
    .auth-toggle button:hover {
      background-color: #2E2138; /* Цвет фона */
      color: #fff; /* Цвет текста */
      border-color: #2E2138; /* Цвет границы */
    }

    /* ====== ФОРМА ============================================================================================ */
    /* Общие стили формы */
    .auth-form {
      display: flex; /* Flexbox */
      flex-direction: column; /* Колоночная направленность */
      gap: 16px; /* Расстояние между элементами */
      margin: 0px 60px; /* Отступы по бокам */
    }

    /* Группа полей ввода */
    .input-group {
      position: relative; /* Относительное позиционирование */
    }

    /* Иконка в поле ввода */
    .input-group .icon {
      position: absolute; /* Абсолютное позиционирование */
      top: 50%; /* Позиционирование сверху */
      left: 12px; /* Позиционирование слева */
      transform: translateY(-50%); /* Центрирование по вертикали */
      width: 20px; /* Ширина */
      height: 20px; /* Высота */
      opacity: 0.7; /* Прозрачность */
    }

    /* Поле ввода */
    .input-group input {
      width: 100%; /* На всю ширину */
      padding: 12px 12px 12px 44px; /* Внутренние отступы */
      border: 1px solid #bfbfbf; /* Граница */
      border-radius: 8px; /* Закругление углов */
      font-size: 15px; /* Размер шрифта */
      font-weight: 300;
    }

    /* Чекбокс "Запомнить меня" */
    .save-login {
      display: flex; /* Flexbox */
      gap: 8px; /* Расстояние между элементами */
      font-size: 14px; /* Размер шрифта */
      color: #444; /* Цвет текста */
      justify-content: center;
    }

    /* Кнопка отправки формы */
    .login-btn {
      background-color: #2E2138; /* Цвет фона */
      color: #fff; /* Цвет текста */
      font-size: 16px; /* Размер шрифта */
      padding: 12px; /* Внутренние отступы */
      border: none; /* Убираем границу */
      border-radius: 15px; /* Закругление углов */
      cursor: pointer; /* Курсор-указатель */
      transition: background 0.3s ease; /* Плавное изменение фона */
      font-weight: 600;
    }

    /* Эффект при наведении на кнопку */
    .login-btn:hover {
      background-color: #2E2138; /* Цвет фона */
    }

    /* Ссылка на регистрацию */
    .register {
      color: #111111; /* Цвет текста */
      text-align: center; /* Выравнивание по центру */
      font-size: 12px; /* Размер шрифта */
      font-weight: 200; /* Толщина шрифта */
    } 

    /* Стили для ссылки */
    .register a {
      text-decoration: none; /* Убираем подчеркивание */  
      color: #111111; /* Цвет текста */
    }

    /* Эффект при наведении на ссылку */
    .register a:hover {
      text-decoration: underline; /* Подчеркивание */
    }
  </style>
</head>
<body>
  <div class="container-login">
    <header class="logo">
      <a class="logo" href="index">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" width="65" height="65" />
        Бизнес‑Мост
      </a>
    </header>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Вход</h2>
        <div class="auth-toggle">
          <button id="phoneBtn" class="active">Телефон</button>
          <button id="emailBtn">Почта</button>
        </div>
        <form class="auth-form">
          <div class="input-group">
            <img src="{{ url_for('static', filename='phone.png') }}" alt="icon" class="icon" id="inputIcon" />
            <input type="tel" id="phoneInput" placeholder="Номер телефона" required />
          </div>
          <div class="input-group">
            <img src="{{ url_for('static', filename='password.png') }}" alt="icon" class="icon" id="inputIcon" />
            <input type="password" id="passwordInput" placeholder="Пароль" required />
          </div>
          <label class="save-login">
            <input type="checkbox" />
            Сохранить вход
          </label>
          <button type="submit" class="login-btn">Войти</button>
          <p class="register">Нет аккаунта? <a href="registration">Регистрация</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
