<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon", type="image/png", sizes="228x228", href="{{ url_for('static', filename='logo.png') }}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet" />
  <title>Бизнес‑Мост | Вход</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Unbounded', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('static/authorization.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

  </style>
</head>
<body>
  <div class="container-login">
    <header class="logo">
      <a class="logo" href="index">
        <img src="{{ url_for('static', filename = 'logo.png')}}" alt="logo" width="65" height="65" />
        Бизнес‑Мост
      </a>
    </header>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Вход</h2>
        <div class="auth-toggle">
          <button id="phoneBtn" class="active">Телефон</button>
          <button id="emailBtn">Почта</button>
        </div>
        <form class="auth-form">
          <div class="input-group">
            <img src="{{ url_for('static', filename='phone.png')}}" alt="icon" class="icon" id="inputIcon" />
            <input type="tel" id="authInput" placeholder="Номер телефона" required />
          </div>
          <label class="save-login">
            <input type="checkbox" />
            Сохранить вход
          </label>
          <button type="submit" class="login-btn">Войти</button>
          <p class="register">Нет аккаунта? <a href="registration">Регистрация</a></p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const phoneBtn = document.getElementById('phoneBtn');
    const emailBtn = document.getElementById('emailBtn');
    const authInput = document.getElementById('authInput');
    const inputIcon = document.getElementById('inputIcon');
  
    let maskHandler = null;
  
    // Маска телефона
    function applyPhoneMask(input) {
      function maskInput(event) {
        let matrix = '+_ (___) ___-__-__',
            i = 0,
            def = matrix.replace(/\D/g, ''),
            val = event.target.value.replace(/\D/g, '');
        if (def.length >= val.length) val = def;
        event.target.value = matrix.replace(/./g, function (a) {
          return /[_\d]/.test(a) && i < val.length
            ? val.charAt(i++)
            : i >= val.length
            ? ''
            : a;
        });
      }
  
      input.addEventListener('input', maskInput);
      maskHandler = maskInput;
      input.dispatchEvent(new Event('input'));
    }
  
    function removePhoneMask(input) {
      if (maskHandler) {
        input.removeEventListener('input', maskHandler);
        maskHandler = null;
      }
      input.value = '';
    }
  
    // Телефон по умолчанию
    phoneBtn.addEventListener('click', () => {
      phoneBtn.classList.add('active');
      emailBtn.classList.remove('active');
  
      authInput.type = 'tel';
      authInput.placeholder = 'Номер телефона';
      inputIcon.src = '{{ url_for ("static", filename = "phone.png")}}';
  
      applyPhoneMask(authInput);
    });
  
    // Почта
    emailBtn.addEventListener('click', () => {
      emailBtn.classList.add('active');
      phoneBtn.classList.remove('active');
  
      removePhoneMask(authInput);
      authInput.type = 'email';
      authInput.placeholder = 'Введите почту';
      inputIcon.src = "{{ url_for ('static', filename = 'mail.png')}}";
    });
  
    // Маска по умолчанию при загрузке
    applyPhoneMask(authInput);
  </script>
</body>
</html>
