{% extends "admin/base.html" %}

{% block content %}
  <h1>Административная панель</h1>
  <div class="admin-stats">
    <div class="stat-card">
      <h3>Пользователи</h3>
      <p>{{ users_count }}</p>
    </div>
    <div class="stat-card">
      <h3>Статьи</h3>
      <p>{{ articles_count }}</p>
    </div>
    <div class="stat-card">
      <h3>Эксперты</h3>
      <p>{{ experts_count }}</p>
    </div>
  </div>
{% endblock %}
