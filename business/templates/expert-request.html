<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='img/favicon.png') }}">
  <title>Бизнес-Мост | Заявка эксперта</title>
</head>
<body class="expert-application-page">
  <div class="expert-application-container">
    <h1 class="expert-application-title">Заявка на вступление в эксперты</h1>
    


    <form class="expert-application-form" id="expertApplicationForm" method = "post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="expert-user-info">
        <p><strong>Ваши данные:</strong></p>
        <p>ФИО: <span id="user-fullname">{{ current_user.user_surname }} {{ current_user.user_name }} {{ current_user.user_daddy }}</span></p>
        <p>Email: {{ current_user.user_email }}</p>
      </div>
      
      <div class="expert-form-group">
        <label for="company" class="expert-form-label">
          Название предприятия/бизнеса <span class="expert-required-field">*</span>
        </label>
        <input type="text" id="company" class="expert-form-input" required placeholder="ООО 'Пример'">
      </div>

      <div class="expert-form-group">
        <label for="position" class="expert-form-label">
          Ваша роль в предприятии <span class="expert-required-field">*</span>
        </label>
        <input type="text" id="position" class="expert-form-input" required placeholder="Директор/Основатель/Менеджер и т.д.">
      </div>

      <div class="expert-form-group">
        <label for="expertise" class="expert-form-label">
          Область экспертизы <span class="expert-required-field">*</span>
        </label>
        <select id="expertise" class="expert-form-select" required>
          <option value="" disabled selected>Выберите область</option>
          <option value="marketing">Маркетинг и продажи</option>
          <option value="management">Управление бизнесом</option>
          <option value="finance">Финансы и инвестиции</option>
          <option value="hr">HR и управление персоналом</option>
          <option value="it">IT и цифровизация</option>
          <option value="production">Производство и логистика</option>
          <option value="law">Юриспруденция</option>
          <option value="other">Другое</option>
        </select>
      </div>

      <div class="expert-form-group" id="otherFieldContainer" style="display: none;">
        <label for="otherExpertise" class="expert-form-label">Укажите вашу область экспертизы</label>
        <input type="text" id="otherExpertise" class="expert-form-input" placeholder="Ваша специализация">
      </div>

      <div class="expert-form-group">
        <label for="experience" class="expert-form-label">
          Опыт работы в данной области (лет) <span class="expert-required-field">*</span>
        </label>
        <input type="number" id="experience" class="expert-form-input" required min="1" max="50" placeholder="5">
      </div>

      <div class="expert-form-group">
        <label for="description" class="expert-form-label">
          Краткое описание вашей экспертизы <span class="expert-required-field">*</span>
        </label>
        <textarea id="description" class="expert-form-input" rows="4" required placeholder="Опишите ваш опыт, достижения и компетенции"></textarea>
      </div>

      <button type="submit" class="expert-submit-btn">Отправить заявку</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/expert-request.js') }}"></script>

</body>
</html>
