<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='favicon.png') }}">
  <title>Бизнес‑Мост | Вход</title>
</head>
<body class="login-page">
  <div class="container-login">
    <header class="logo">
      <a class="logo" href="index">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" width="65" height="65" />
        Бизнес‑Мост
      </a>
    </header>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Вход</h2>
        <div class="auth-toggle">
          <button id="phoneBtn" class="active">Телефон</button>
          <button id="emailBtn">Почта</button>
        </div>
        <form class="auth-form-login" id="loginForm" method="post">
          <div class="input-group-login">
            <img src="{{ url_for('static', filename='phone.png') }}" alt="icon" class="icon" id="inputIcon" />
            <input type="tel" id="phoneInput" placeholder="Номер телефона" required />
            <div class="error-message" id="phoneError"></div>
          </div>
          <div class="input-group-login">
            <img src="{{ url_for('static', filename='password.png') }}" alt="icon" class="icon" id="inputIcon" />
            <input type="password" id="passwordInput" placeholder="Пароль" required />
            <div class="error-message" id="passwordError"></div>
          </div>
          <label class="save-login">
            <input type="checkbox" id="rememberMe" />
            Сохранить вход
          </label>
          <button type="submit" class="login-btn">Войти</button>
          <p class="registration">Нет аккаунта? <a href="/reg">Регистрация</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
