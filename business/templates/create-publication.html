<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='favicon.png') }}">
  <title>Бизнес‑Мост | Создание публикации</title>
  <style>

    


  </style>
</head>
<body class="writing-an-article">
  <header class="logo">
    <a class="logo" href="index">
      <img src=" {{ url_for('static', filename='logo.png') }} " alt="logo" width="65" height="65" />
      Бизнес‑Мост
    </a>
  </header>
  <div class="new-article-container">
    <div class="header-wrapper">
      <button class="back-button" onclick="window.location.href='/profile'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h1 class="header-article">Создание статьи</h1>
    </div>

    <div class="form-group">
      <label class="form-label">Изображение</label>
      <div class="file-input-wrapper">
        <div class="file-input-button" id="file-label">Выберите изображение</div>
        <input type="file" id="image" accept="image/*">
        <div class="file-name" id="file-name"></div>
      </div>
    </div>
    
    <div class="form-group">
      <label for="title" class="form-label">Заголовок статьи</label>
      <input type="text" id="title" class="form-input" placeholder="Введите заголовок">
    </div>
    
    <div class="form-group">
      <label for="content" class="form-label">Текст статьи</label>
      <textarea id="content" class="form-input" placeholder="Напишите содержание статьи..."></textarea>
    </div>

    <button class="submit-btn" onclick="submitArticle()">Опубликовать</button>
  </div>

  <script src="{{ url_for('static', filename='html-size.js') }}"></script>

  <script src="{{ url_for('static', filename='create-publication.js') }}"></script>

</body>
</html>
