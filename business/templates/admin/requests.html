{% extends "admin/base.html" %}
<meta name="csrf-token" content="{{ csrf_token() }}">
{% block content %}
<div class="requests-container">
  <h1>Управление запросами</h1>
  
  <div class="request-tabs">
    <a href="{{ url_for('admin_bp.requests_management') }}" 
      class="tab-btn {% if request.endpoint == 'admin_bp.requests_management' %}active{% endif %}">
      Заявки на подтверждение
    </a>
    <a href="{{ url_for('admin_bp.expert_requests') }}" 
      class="tab-btn {% if request.endpoint == 'admin_bp.expert_requests' %}active{% endif %}">
      Заявки на эксперта
    </a>
    <a href="{{ url_for('admin_bp.article_requests') }}" 
      class="tab-btn {% if request.endpoint == 'admin_bp.article_requests' %}active{% endif %}">
      Статьи на проверку
    </a>
    <!-- Новая вкладка для заявок на верификацию -->
    <a href="{{ url_for('admin_bp.passport_requests') }}" 
      class="tab-btn {% if request.endpoint == 'admin_bp.passport_requests' %}active{% endif %}">
      Верификация аккаунтов
    </a>
  </div>

  <div class="tab-content">
    {% block requests_content %}
      <p>Выберите раздел запросов</p>
    {% endblock %}
  </div>
</div>
{% endblock %}
