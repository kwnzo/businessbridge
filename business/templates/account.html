<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='favicon.png') }}">
  <title>Бизнес‑Мост | Профиль</title>
  <style>
   
   .profile-outer-frame {
        background: #2E2138; /* Фиолетовая рамка */
        border-radius: 15px;
        padding: 8px;
        margin: 30px auto;
        width: 90%;
        max-width: 1400px;
    }

    .profile-inner-container {
        background: white; /* Сам контейнер белый */
        border-radius: 10px;
        padding: 0px 30px 30px 30px;
    }


    .profile-title-wrapper {
        text-align: center; /* Центруем обёртку */
        margin-bottom: 30px;
    }

    .profile-title {
        display: inline-block; /* Фон только по ширине текста */
        background: #2E2138;
        color: white;
        padding: 0px 20px 10px;
        border-radius: 0px 0px 25px 25px;
        font-size: 25px;
        margin: 0;
    }

    .profile-main {
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 20px 0;
    }

    .profile-avatar img {
        width: 175px;
        height: 175px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #2E2138; /* Рамка вокруг аватарки */
    }
    
    .profile-info h2 {
        color: #111111;
    }

    .profile-info p {
        font-size: 15px;
        margin: 8px 0;
        color: #2E2138;
    }

    .profile-buttons {
        display: flex;
        gap: 30px;
        align-items: center;
    }

    .profile-buttons a {
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        border-radius: 40px;
        text-decoration: none;
        transition: background-color 0.3s;
        white-space: nowrap; /* Чтобы текст не переносился */
    }

    /* Кнопка "Редактировать данные" */
    .edit-button {
        background-color: #2E2138;
        color: white;
        padding: 20px 30px;
        border: 2px solid #2E2138;
    }

    /* Кнопка "Подтверждение аккаунта" */
    .confirm-button {
        background-color: #ffffff;
        color: #2E2138;
        border: 2px solid #2E2138;
        padding: 10px 16px;
    }

    .confirm-button span {
        display: block;
        font-size: 12px;
        font-weight: normal;
        margin-top: 3px;
    }

    /* Hover эффекты */
    .edit-button:hover {
        background-color: #46305e;
    }

    .confirm-button:hover {
        background-color: #2E2138;
        color: white;
    }

  </style>
</head>
<body>
    <!-- ======= Header ======= -->
<header class="header">
    <div class="header-inner">
        <!-- logo -->
        <a class="logo" href="index">
        <img src="{{ url_for('static', filename='logo.png')}}" alt="logo" width="65" height="65">
        Бизнес‑Мост
        </a>

        <!-- Навигация -->
        <nav class="header-nav">
        <a href="index">Главная</a>
        <a href="#">Чат</a>
        <a href="#">Эксперты</a>
        <a href="login" class="login-button" id="login-btn">Вход</a>
        </nav>
    </div>
</header>
<body>
    <div class="profile-outer-frame">
        <div class="profile-inner-container">
            <div class="profile-title-wrapper">
                <h3 class="profile-title">Ваш профиль</h3>
            </div>
            <div class="profile-main">
                <div class="profile-avatar">
                    <img src="{{ url_for('static', filename='avatar.jpg') }}" alt="Аватар пользователя">
                </div>
                <div class="profile-info">
                    <p><h2>Иванов Иван Иванович</h2></p>
                    <p>+7 (999) 123-45-67</p>
                    <p>ivan@example.com</p>
                    <p>01.01.1990</p>
                </div>
            </div>
            <div class="profile-buttons">
                <a href="" class="edit-button">Редактировать данные</a>
                <a href="" class="confirm-button">
                    Подтверждение аккаунта<br><span>Не подтверждён</span>
                </a>
            </div>
        </div>   
    </div>
</body>
</html>
