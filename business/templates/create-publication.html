<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='img/favicon.png') }}">
  <title>Бизнес‑Мост | Создание публикации</title>
</head>
<body class="writing-an-article">
  <header class="logo">
    <a class="logo" href="/index">
      <img src=" {{ url_for('static', filename='img/logo.png') }} " alt="logo" width="65" height="65" />
      Бизнес‑Мост
    </a>
  </header>
  <div class="new-article-container">
    <div class="header-wrapper">
      <button class="back-button" onclick="window.location.href='/profile'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h1 class="header-article">Создание статьи</h1>
    </div>

    <form id="article-form" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      
      <div class="form-group">
        <label class="form-label">Изображение (в формате 2:1) <span class="required-field">*</span></label>
        <div class="file-input-wrapper">
          <div class="file-input-button" id="file-label">Выберите изображение</div>
          <input type="file" id="image" name="image" accept="image/*" required>
          <div class="file-name" id="file-name"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="title" class="form-label">Заголовок статьи<span class="required-field">*</span></label>
        <input type="text" id="title" name="title" class="form-input" placeholder="Введите заголовок" required>
      </div>
      
      <div class="form-group">
        <label for="content" class="form-label">Текст статьи<span class="required-field">*</span></label>
        <textarea id="content" name="content" class="form-input" placeholder="Напишите содержание статьи..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Опубликовать</button>
    </form>
  </div>

<div class="custom-modal" id="resultModal">
  <div class="modal-content">
    <div class="modal-body">
      <p id="modal-message"></p>
    </div>
    <div class="modal-footer">
      <button class="modal-close-btn" id="modalCloseBtn">OK</button>
    </div>
  </div>
</div>

  <script src="{{ url_for('static', filename='js/create-publication.js') }}"></script>
  </body>
</html>
