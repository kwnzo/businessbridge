<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon", type="image/png", href="{{ url_for('static', filename='favicon.png') }}">
  <title>Бизнес‑Мост | Создание публикации</title>
</head>
<body class="reading-page">
    <header class="header">
        <div class="header-inner">
            <!-- logo -->
            <a class="logo" href="index">
                <img src="{{ url_for('static', filename='logo.png')}}" alt="logo" width="65" height="65">
                Бизнес‑Мост
            </a>
        
            <!-- Навигация -->
            <nav class="header-nav">
                <a href="index">Главная</a>
                <a href="#">Эксперты</a>
                {% if current_user %}
                  <a href="/profile" class="account-button-if-login">
                    <img src="{{ url_for('user_avatar', user_id=current_user.id) }}" 
                         alt="Аватар" 
                         class="avatar-icon-if-login js-avatar"
                         data-fallback="{{ url_for('static', filename='img/avatar-placeholder.png') }}">
                    <span class="account-name-if-login">
                      {{ current_user.user_surname }} {{ current_user.user_name[0] }}.
                      {% if current_user.user_daddy %}{{ current_user.user_daddy[0] }}.{% endif %}
                    </span>
                  </a>
                {% else %}
                  <a href="login" class="login-button" id="login-btn">Вход</a>
                {% endif %}
              </nav>
        </div>
    </header>
      
</body>
</html>
